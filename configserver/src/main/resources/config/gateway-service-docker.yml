# Routes are defined in gateway's GatewayConfig.java (Java-based
# RouteLocator), not here.
server:
  port: 8080

management:
  server:
    # Actuator on its own port: it is not behind the gateway login, so it must
    # never be published to the network (compose binds it to 127.0.0.1 only).
    port: 9081
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://zipkin:9411/api/v2/spans}

# Circuit Breaker
# Default time limit is 1s, which the first requests after startup exceed (cold
# start) and get the 503 fallback even though the call would have succeeded.
resilience4j:
  timelimiter:
    instances:
      ecomBreaker:
        timeoutDuration: 30s
  circuitbreaker:
    instances:
      ecomBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slidingWindowType: count_based


# SECURITY
spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 5s   # default 35s; makes recreated services reachable sooner
  data:
    redis:
      host: redis
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8443/realms/ecom-app
          jwk-set-uri: http://keycloak:8080/realms/ecom-app/protocol/openid-connect/certs

eureka:
  dashboard:
    url: http://eureka:8761   # target of the gateway's /eureka/** routes
  client:
    serviceUrl:
      defaultZone: http://eureka:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 5   # default 30s